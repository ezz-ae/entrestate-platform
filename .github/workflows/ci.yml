name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Use corepack (bundled with Node) instead of a third-party pnpm action,
      # so this runs even under a "GitHub-authored actions only" repo policy.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: i18n parity
        run: pnpm i18n

      - name: Invariant guards (copy rules + auth matrix)
        run: pnpm guards

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # THE SECOND BUILD ROOT. apps/terminal is its own Vercel project
      # (entrestate-os) with its own package.json and lockfile — there is no
      # pnpm workspace joining them, so the install above does not touch it and
      # every gate above is blind to it. It shipped with
      # `typescript: { ignoreBuildErrors: true }` and 423 uncaught type errors.
      # These two steps are the first verification that half of this repository
      # has ever had in CI. The ratchet fails only when the debt GROWS.
      - name: Install (terminal)
        run: pnpm install --frozen-lockfile
        working-directory: apps/terminal

      - name: Type debt ratchet (terminal)
        run: pnpm typecheck:terminal
