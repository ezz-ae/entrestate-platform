name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Use corepack (bundled with Node) instead of a third-party pnpm action,
      # so this runs even under a "GitHub-authored actions only" repo policy.
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.28.0 --activate

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: i18n parity
        run: pnpm i18n

      - name: Invariant guards (copy rules + auth matrix)
        run: pnpm guards

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # There used to be two more steps here, installing and type-checking
      # apps/terminal as "the second build root". It was not one: apps/terminal
      # was a vendored copy of the Terminal, and the Vercel project entrestate-os
      # builds ezz-ae/Entrestate_os from its own root. So CI installed 22 MB and
      # ratcheted type debt for a directory nobody deployed, on every push, while
      # the deployed Terminal had no CI at all. It has its own now, in its own
      # repository (Entrestate OS CI / build_and_test).
